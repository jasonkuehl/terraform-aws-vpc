name: Changelog
on:
  push:
    branches:
      - main
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # github-changelog-generator reads GitHub's API; git-cliff only needs git history
      - name: "✏️ Generate release changelog"
        uses: orhun/git-cliff-action@v4
        with:
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
